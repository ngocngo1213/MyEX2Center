plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Shared by MyEX2Center (:app) and EX2 Store (:store): vehicle access (CarApiHelper, ParkGate),
// the silent .apk/.xapk installer, the app catalog + store screen, theme (light/dark),
// 8pt dimens, icon set and fonts.
android {
    namespace 'com.mipago.ex2center.core'
    compileSdk 28

    defaultConfig {
        minSdk 28
        targetSdk 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    // Car API compilation stubs (real classes are provided by the Geely head unit at runtime)
    compileOnly files('libs/car-stubs.jar')

    api 'androidx.core:core-ktx:1.3.2'
    api 'androidx.recyclerview:recyclerview:1.1.0'
}
